<section class="player-panel">
  <span ng-bind="$ctrl.playerLabel"></span>
  <strong id="match-status" ng-bind="$ctrl.status"></strong>
</section>

<section id="map">
  <div id="fleetboard" ng-class="{ disabled: $ctrl.phase === 'playing' }"></div>
  <div
    id="hitboard"
    ng-show="$ctrl.phase === 'playing'"
    ng-class="{ disabled: !$ctrl.canStrike }"
    ng-disabled="!$ctrl.canStrike"
  ></div>
  <div id="fleet" ng-class="{ 'room-active': $ctrl.phase === 'playing' }">
    <div
      class="place-holder"
      ng-repeat="ship in $ctrl.fleet"
      ng-attr-id="placeholder-{{ship.id}}"
      ng-style="{ width: ship.placeholderWidth }"
    >
      <fleet-ship ship="ship"></fleet-ship>
    </div>
  </div>
</section>

<div id="setup-actions" ng-show="$ctrl.phase === 'setup'">
  <button
    id="ready"
    disabled
    ng-click="$ctrl.join()"
    ng-disabled="!$ctrl.boardReady || $ctrl.phase !== 'setup'"
  >
    Ready
  </button>

  <button
    id="random"
    ng-disabled="$ctrl.phase !== 'setup'"
    ng-click="$ctrl.random()"
  >
    Random
  </button>

  <button
    id="reset"
    ng-disabled="$ctrl.phase !== 'setup'"
    ng-click="$ctrl.reset()"
  >
    Reset
  </button>
</div>
