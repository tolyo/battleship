<game-status state="$ctrl.gameState"></game-status>

<section id="map">
  <fleet-board state="$ctrl.gameState"></fleet-board>
  <battle-board
    state="$ctrl.gameState"
    on-strike="$ctrl.strike(tile)"
  ></battle-board>
</section>

<setup-actions
  state="$ctrl.gameState"
  on-ready="$ctrl.join()"
  on-random="$ctrl.random()"
  on-reset="$ctrl.reset()"
></setup-actions>
