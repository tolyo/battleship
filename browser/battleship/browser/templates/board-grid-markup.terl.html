<div
  ng-attr-id="${board_id}"
  ng-show="$ctrl.visible === undefined ? !$ctrl.hidden : $ctrl.visible"
  ng-class="${disabled_classes}">
  <div class="board-row" ng-repeat="row in $ctrl.rows">
    <div
      ng-repeat="tile in row"
      class="${tile_class}"
      ng-attr-id="${tile_id}"
      ng-attr-data-row="${tile_row}"
      ng-attr-data-column="${tile_column}"
      ng-attr-data-state="${tile_state}"
      ng-click="${submit_expression}"
      ng-class="tile.classes">
    </div>
  </div>
</div>
